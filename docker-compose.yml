services:
  redis:
    image: redis:latest
    container_name: my-redis
    ports:
      - "6379:6379"
  my-sql:
    image : mysql:8.0
    container_name : my-sql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=sbms8am
  app:
    build: .
    container_name: my-spring-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/sbms8am
    depends_on:
      - redis